<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNNY 999 BOT | LUXURY GAMING STORE</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.4);
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            margin: 0; padding: 0; background-color: var(--bg-dark);
            color: #ffffff; font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- LUXURY ANIMATED BG --- */
        .luxury-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
            z-index: -2;
        }

        .glow-sphere {
            position: fixed; width: 400px; height: 400px;
            background: var(--gold-glow); filter: blur(150px);
            border-radius: 50%; top: -100px; right: -100px; z-index: -1;
            animation: float 10s infinite alternate;
        }

        @keyframes float { from { transform: translate(0,0); } to { transform: translate(-50px, 50px); } }

        /* --- HEADER & LOGO --- */
        header {
            text-align: center; padding: 60px 20px 40px;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .logo-box img {
            width: 130px; filter: drop-shadow(0 0 15px #ff0000);
            margin-bottom: 15px;
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900;
            letter-spacing: 10px; color: #fff; text-transform: uppercase;
            text-shadow: 0 0 20px var(--gold-glow); margin: 0;
        }

        .sub-tag {
            font-family: 'Orbitron', sans-serif; color: var(--gold);
            font-size: 0.8rem; letter-spacing: 5px; margin-top: 10px; opacity: 0.8;
        }

        /* --- GRID LAYOUT --- */
        .main-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px; padding: 50px 20px; max-width: 1200px; margin: 0 auto;
        }

        /* --- VVIP GLASS CARD --- */
        .glass-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px; padding: 40px 30px;
            backdrop-filter: blur(15px); text-align: center;
            position: relative; overflow: hidden;
        }

        .glass-card::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }

        .glass-card:hover::after { left: 100%; }
        .glass-card:hover { border-color: var(--gold); transform: translateY(-5px); }

        .card-icon { font-size: 40px; color: var(--gold); margin-bottom: 20px; opacity: 0.9; }
        .card-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin-bottom: 25px; letter-spacing: 2px; }

        /* --- INPUTS & BUTTONS --- */
        .luxury-input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 12px; padding: 15px; color: #fff; text-align: center;
            font-family: 'Orbitron', sans-serif; margin-bottom: 20px; outline: none;
        }

        .luxury-input:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--gold-glow); }

        .buy-btn {
            width: 100%; padding: 15px; margin-bottom: 12px; border: none;
            border-radius: 12px; font-family: 'Orbitron', sans-serif; font-weight: 900;
            cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
            letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center;
        }

        .btn-prime { background: #fff; color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .btn-outline:hover { background: var(--gold); color: #000; }

        /* --- PAYMENT SCREEN --- */
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }

        .qr-container {
            background: #fff; padding: 15px; border-radius: 20px; margin: 30px 0;
            box-shadow: 0 0 30px var(--gold-glow);
        }

        .qr-container img { width: 220px; display: block; }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 600px) {
            .brand-name { font-size: 2.2rem; letter-spacing: 5px; }
            .main-grid { padding: 30px 15px; }
        }

        .active-flex { display: flex !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="luxury-bg"></div>
<div class="glow-sphere"></div>

<header>
    <div class="logo-box">
        <img src="https://logodownload.org/wp-content/uploads/2019/08/free-fire-logo-1.png" alt="Free Fire Logo">
    </div>
    <h1 class="brand-name">SUNNY 999 BOT</h1>
    <p class="sub-tag">ULTRA VVIP PANEL V4.0</p>
    
    <div style="margin-top: 25px;">
        <a href="https://instagram.com/sunny999bot" target="_blank" style="text-decoration:none; color:#fff; font-size: 13px; border: 1px solid var(--border); padding: 10px 20px; border-radius: 50px;">
            <i class="fab fa-instagram" style="color:var(--gold);"></i> INSTAGRAM
        </a>
    </div>
</header>

<div class="main-grid" id="main-ui">
    
    <div class="glass-card">
        <div class="card-icon"><i class="fas fa-gem"></i></div>
        <div class="card-title">DIAMOND INJECTOR</div>
        <input type="number" class="luxury-input" placeholder="PLAYER UID">
        <button class="buy-btn btn-prime" onclick="initiate('5K Diamonds', 499)"><span>5,000 DM</span> <span>₹499</span></button>
        <button class="buy-btn btn-outline" onclick="initiate('10K Diamonds', 899)"><span>10,000 DM</span> <span>₹899</span></button>
        <button class="buy-btn btn-outline" onclick="initiate('Unlimited', 1999)"><span>UNLIMITED</span> <span>₹1,999</span></button>
    </div>

    <div class="glass-card">
        <div class="card-icon"><i class="fas fa-microchip"></i></div>
        <div class="card-title">8PRIME CHIPSET</div>
        <input type="number" class="luxury-input" placeholder="PLAYER UID">
        <button class="buy-btn btn-prime" onclick="initiate('8Prime v1', 1200)"><span>v1 CHIPSET</span> <span>₹1,200</span></button>
        <button class="buy-btn btn-outline" onclick="initiate('PRO CHIP', 2500)"><span>PRO CHIPSET</span> <span>₹2,500</span></button>
        <button class="buy-btn btn-outline" onclick="initiate('ULTRA CHIP', 4500)"><span>ULTRA CHIPSET</span> <span>₹4,500</span></button>
    </div>

    <div class="glass-card">
        <div class="card-icon"><i class="fas fa-credit-card"></i></div>
        <div class="card-title">CARDING LIMIT</div>
        <input type="number" class="luxury-input" placeholder="PLAYER UID">
        <button class="buy-btn btn-prime" onclick="initiate('5K Limit', 500)"><span>5K LIMIT</span> <span>₹500</span></button>
        <button class="buy-btn btn-outline" onclick="initiate('10K Limit', 1000)"><span>10K LIMIT</span> <span>₹1,000</span></button>
    </div>

</div>

<div id="payment-overlay" class="overlay-screen">
    <div class="card-title" id="pay-item" style="color:var(--gold);">5,000 DIAMONDS</div>
    <div style="font-family:'Orbitron'; font-size: 2.5rem; margin: 10px 0;" id="pay-price">₹499</div>
    
    <div class="qr-container">
        <img src="my-qr.png" onerror="this.src='https://via.placeholder.com/200?text=SCAN+TO+PAY'" alt="QR Code">
    </div>

    <p style="font-size: 14px; opacity: 0.6; letter-spacing: 2px;">UPI ID: sunny999@upi</p>
    
    <button class="buy-btn btn-prime" style="width:300px; margin-top:20px;" onclick="verify()">SUBMIT VERIFICATION</button>
    <p onclick="location.reload()" style="cursor:pointer; color: #ff4444; font-size: 11px; margin-top: 20px; letter-spacing: 2px;">CANCEL TRANSACTION</p>
</div>

<div id="success-overlay" class="overlay-screen">
    <div class="card-icon" style="font-size: 60px;"><i class="fas fa-shield-check fa-pulse" style="color:var(--gold);"></i></div>
    <div class="card-title">SECURE VERIFICATION</div>
    <div style="width:300px; height:2px; background:var(--border); margin: 30px 0;">
        <div id="bar" style="width:0%; height:100%; background:var(--gold); box-shadow: 0 0 10px var(--gold);"></div>
    </div>
    <p id="status-msg" style="font-size: 12px; color: #0f0; font-family: 'Orbitron';">Bypassing Servers...</p>
    <br><br>
    <a href="https://instagram.com/sunny999bot" class="buy-btn btn-prime" style="width:300px; text-decoration:none; justify-content:center;">SEND SCREENSHOT</a>
</div>

<footer style="text-align: center; padding: 40px; font-size: 10px; opacity: 0.3; letter-spacing: 3px; font-family: 'Orbitron';">
    © 2026 SUNNY 999 BOT | ENCRYPTED VVIP SESSION
</footer>

<script>
    let currentP = 0;

    function initiate(item, price) {
        let uid = event.target.parentElement.querySelector('input').value;
        if(uid.length < 5) { alert("ERROR: INVALID PLAYER UID"); return; }
        
        currentP = price;
        document.getElementById('main-ui').classList.add('hidden');
        document.getElementById('payment-overlay').classList.add('active-flex');
        document.getElementById('pay-item').innerText = item;
        document.getElementById('pay-price').innerText = "₹" + price;
    }

    function verify() {
        if (/Mobi|Android/i.test(navigator.userAgent)) {
            window.location.href = `phonepe://pay?pa=sunny999@upi&pn=Sunny999Bot&am=${currentP}`;
        }
        document.getElementById('payment-overlay').classList.remove('active-flex');
        document.getElementById('success-overlay').classList.add('active-flex');
        
        let w = 0;
        let b = document.getElementById('bar');
        let msg = document.getElementById('status-msg');
        
        let itv = setInterval(() => {
            w++; b.style.width = w + "%";
            if(w == 30) msg.innerText = "ACCESSING MAIN FRAME...";
            if(w == 60) msg.innerText = "INJECTING PACKETS...";
            if(w == 90) msg.innerText = "FINALIZING ACTIVATION...";
            if(w >= 100) { 
                clearInterval(itv); 
                alert("SYSTEM BUSY: Send payment screenshot to Instagram for manual activation.");
            }
        }, 120);
    }
</script>

</body>
</html>

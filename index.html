<!DOCTYPE html>
<html>
<head>
    <title>SUNNY 999 BOT</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: black;
            color: white;
            text-align: center;
        }

        .logo {
            margin-top: 20px;
            font-size: 28px;
            color: gold;
            font-weight: bold;
        }

        .section {
            display: none;
            padding: 20px;
        }

        .active {
            display: block;
        }

        .card {
            display: inline-block;
            width: 250px;
            padding: 20px;
            margin: 10px;
            border: 2px solid gold;
            border-radius: 10px;
            background: #111;
            cursor: pointer;
        }

        .card:hover {
            background: gold;
            color: black;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: gold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .upi {
            margin-top: 15px;
            background: #111;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }

        img {
            margin-top: 15px;
            width: 200px;
        }
    </style>
</head>

<body>

<div class="logo">🔥 SUNNY 999 BOT 🔥</div>

<!-- HOME -->
<div id="home" class="section active">
    <h2>Select Card Limit</h2>

    <div class="card" onclick="selectPlan(5000,500)">₹5000 Limit<br>₹500</div>
    <div class="card" onclick="selectPlan(10000,1000)">₹10000 Limit<br>₹1000</div>
    <div class="card" onclick="selectPlan(50000,5000)">₹50000 Limit<br>₹5000</div>
</div>

<!-- PAYMENT -->
<div id="payment" class="section">
    <h2>Payment Page</h2>

    <div id="payText"></div>

    <div class="upi">UPI: sunny999@upi</div>

    <br>
    <img src="https://via.placeholder.com/200">

    <br>
    <button class="btn" onclick="goSuccess()">I HAVE PAID</button>
</div>

<!-- SUCCESS -->
<div id="success" class="section">
    <h2>✔ Payment Submitted</h2>
    <p>Verification in progress...</p>

    <button class="btn" onclick="goWhatsApp()">Contact on WhatsApp</button>
</div>

<script>
    let selectedLimit = 0;
    let selectedPrice = 0;

    function selectPlan(limit, price) {
        selectedLimit = limit;
        selectedPrice = price;

        document.getElementById("home").classList.remove("active");
        document.getElementById("payment").classList.add("active");

        document.getElementById("payText").innerHTML =
        "Pay ₹" + price + " for ₹" + limit + " limit";
    }

    function goSuccess() {
        document.getElementById("payment").classList.remove("active");
        document.getElementById("success").classList.add("active");
    }

    function goWhatsApp() {
        window.open("https://wa.me/91XXXXXXXXXX");
    }
</script>

</body>
</html>

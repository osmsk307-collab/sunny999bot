<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUNNY 999 BOT - Reward Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.9)),
url('https://images.unsplash.com/photo-1542751371-adc38448a05e') center/cover;
color:white;min-height:100vh
}
header{
display:flex;justify-content:space-between;align-items:center;
padding:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);
position:sticky;top:0
}
.logo{font-size:32px;font-weight:bold;color:orange}
.btn{
padding:10px 20px;border:none;border-radius:12px;cursor:pointer;
font-weight:bold
}
.login{background:#222;color:white}
.signup{background:orange;color:black}
.container{
max-width:1200px;margin:auto;padding:20px;
display:grid;grid-template-columns:2fr 1fr;gap:20px
}
.card{
background:rgba(0,0,0,.55);
border:1px solid rgba(255,165,0,.3);
border-radius:20px;padding:20px;backdrop-filter:blur(10px)
}
h1{font-size:42px;margin:10px 0}
input{
width:100%;padding:15px;border:none;border-radius:12px;
background:#111;color:white;margin:15px 0
}
.gifts{
display:grid;grid-template-columns:repeat(2,1fr);gap:10px
}
.gift{
padding:15px;background:#111;border:1px solid #333;
border-radius:15px;text-align:center;cursor:pointer
}
.gift:hover,.selected{background:orange;color:black}
.claim{
width:100%;padding:15px;background:orange;color:black;
border:none;border-radius:15px;font-size:18px;font-weight:bold;
margin-top:15px;cursor:pointer
}
.status{margin-top:15px;font-weight:bold}
.live-item{margin:10px 0}
.live-box{
height:200px;background:#111;border-radius:15px;
display:flex;align-items:center;justify-content:center
}
@media(max-width:768px){
.container{grid-template-columns:1fr}
.logo{font-size:22px}
h1{font-size:28px}
}
</style>
</head>
<body>

<header>
<div class="logo">SUNNY 999 BOT</div>
<div>
<button class="btn login">Login</button>
<button class="btn signup">Sign Up</button>
</div>
</header>

<div class="container">
<div class="card">
<div>🟢 SERVER ONLINE | 👥 <span id="online">1287</span> online</div>
<h1>FREE FIRE REWARD PORTAL</h1>
<p>Enter UID and claim your reward</p>

<input type="text" id="uid" placeholder="Enter Free Fire UID">

<div class="gifts">
<div class="gift" onclick="selectGift(this,'100 Diamonds')">100 Diamonds</div>
<div class="gift" onclick="selectGift(this,'Elite Pass')">Elite Pass</div>
<div class="gift" onclick="selectGift(this,'Evo Gun')">Evo Gun</div>
<div class="gift" onclick="selectGift(this,'Legendary Bundle')">Legendary Bundle</div>
</div>

<button class="claim" onclick="claimGift()">VERIFY & CLAIM</button>
<div class="status" id="status"></div>
</div>

<div>
<div class="card">
<h2>🎁 Live Claims</h2>
<div class="live-item" id="claims">RX_HUNTER claimed Evo Gun</div>
</div>

<div class="card" style="margin-top:20px">
<h2>🏆 Leaderboard</h2>
<div>#1 SUNNY ELITE</div>
<div>#2 FF MASTER</div>
<div>#3 HEADSHOT KING</div>
</div>

<div class="card" style="margin-top:20px">
<h2>📺 LIVE STREAM</h2>
<div class="live-box">YouTube Live Embed Here</div>
</div>
</div>
</div>

<script>
let selectedGift = "";
const claims = [
"RX_HUNTER claimed Evo Gun",
"KING_777 claimed Elite Pass",
"PRO_SONU claimed 100 Diamonds",
"DARK_OP claimed Bundle"
];

function selectGift(el,gift){
document.querySelectorAll(".gift").forEach(g=>g.classList.remove("selected"));
el.classList.add("selected");
selectedGift = gift;
}

function claimGift(){
let uid = document.getElementById("uid").value;
let status = document.getElementById("status");

if(!uid || !selectedGift){
status.innerHTML = "⚠️ Enter UID and select gift";
return;
}

status.innerHTML = "⏳ Verifying UID...";
setTimeout(()=>{
status.innerHTML = "📦 Reward queued...";
},1500);

setTimeout(()=>{
status.innerHTML = "✅ Gift selected successfully! Sent to your Free Fire mailbox within 2 hours";
},3000);
}

setInterval(()=>{
document.getElementById("online").innerText =
1200 + Math.floor(Math.random()*300);
},3000);

let i=0;
setInterval(()=>{
i=(i+1)%claims.length;
document.getElementById("claims").innerText=claims[i];
},2500);
</script>

</body>
</html>
